name: Deploy to GitHub Pages

# Actions sind auf den Commit-SHA gepinnt, nicht auf ein bewegliches Tag.
# Ein Tag wie @v4 kann jederzeit auf anderen Code umgehängt werden — wer das
# Tag kontrolliert, führt Code mit den Rechten dieses Workflows aus. Der SHA
# kann das nicht. Die Version steht als Kommentar daneben, damit man beim
# Aktualisieren weiß, wo man herkommt:
#   gh api repos/<owner>/<repo>/releases/latest --jq .tag_name
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Alles entfernen, was zum Projekt gehört, aber nicht zur Website.
      # Ohne diesen Schritt lägen Backend-Code und interne Konfiguration
      # öffentlich unter axion-studio.de/<datei>.
      - name: Strip non-site files
        run: |
          rm -rf supabase          # Edge-Function-Quelltext inkl. Secrets-Doku
          rm -rf .claude           # lokale Dev-Server-Konfiguration
          rm -f  CLAUDE.md AGENTS.md GEMINI.md   # KI-Buildbooks (normalerweise gar nicht getrackt)
          rm -f  README.md         # interne Notizen
          rm -f  .pages.yml        # CMS-Feldkonfiguration; PagesCMS liest sie aus dem
                                   # Repo über die GitHub-API, nicht von der Website
          rm -f  .gitignore        # verrät sonst die Namen der privaten Originaldateien
          echo "--- Was tatsächlich ausgeliefert wird: ---"
          ls -A

      # Ab v4 schließt diese Action Dotfiles ohnehin aus dem Artefakt aus —
      # der explizite rm oben ist die zweite Sicherung, damit der Schutz nicht
      # still verschwindet, falls die Action ihr Verhalten wieder ändert.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
